services:
  db:
    image: mariadb:11.4
    environment:
      TZ: Europe/Berlin
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_DATABASE: ${DB_NAME:-berufsmesse}
      MYSQL_USER: ${DB_USER:-berufsmesse}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "${APP_PORT:-9000}:80"
    environment:
      TZ: Europe/Berlin
      DB_HOST: db
      DB_USER: ${DB_USER:-berufsmesse}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME:-berufsmesse}
      APP_ENV: ${APP_ENV:-production}
      BASE_URL: ${BASE_URL:-/}
    volumes:
      - uploads:/var/www/html/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    profiles: ["tools"]
    ports:
      - "${PMA_PORT:-8080}:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  db_data:
  uploads:
