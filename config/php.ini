; PHP-Einstellungen für den Anwendungscontainer.
;
; Ohne diese Datei galten die Standardwerte: Sitzungen liefen nach 24 Minuten
; ab und lagen im flüchtigen /tmp des Containers. Am Messetag hieß das:
; Wer zwischen zwei Slots eine halbe Stunde Pause hat, ist danach abgemeldet —
; und ein Neu-Bauen des Containers meldet alle gleichzeitig ab.

[Session]
; Acht Stunden decken einen kompletten Schultag ab.
session.gc_maxlifetime = 28800
session.cookie_lifetime = 0
session.save_path = "/var/lib/php/sessions"
; Der Aufräumlauf muss zum längeren Fenster passen.
session.gc_probability = 1
session.gc_divisor = 100
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"

[PHP]
; Uploads: Logos bis 2 MB, Dokumente bis 10 MB (siehe config/config.php).
upload_max_filesize = 12M
post_max_size = 14M
max_execution_time = 60
; Fehler gehören ins Log, nicht in die Ausgabe — die Anwendung setzt das
; zusätzlich selbst (src/bootstrap.php), hier als zweite Absicherung.
display_errors = Off
log_errors = On
error_log = /dev/stderr
expose_php = Off
